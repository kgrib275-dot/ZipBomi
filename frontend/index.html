<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120F08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFBF0" media="(prefers-color-scheme: light)" />
    <meta name="description" content="집보미(ZIPBOMI) — 집에 관한 모든 것. 아파트 실거래가·청약 일정·대출 한도·세금·정책 변화를 한곳에서 숫자와 함께 정리합니다." />
    <script>
      /* 화면 테마 — 첫 그림 전에 data-theme 를 건다 (깜빡임 방지). 값은 layout/Theme.tsx 가 저장한다. */
      (function () {
        try {
          var t = localStorage.getItem("ax_theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 휴대폰 홈 화면에 앱처럼 설치 (PWA, 2026-11-05) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="집보미" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 글꼴: 미리 연결 + 쓰는 굵기만 (본문 400·600·700, 제목 Archivo 600~900·폭 100~125, 라벨 Mono 400) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 웹 글꼴은 화면을 막지 않게 (2026-11-02 속도 개선): 먼저 기기 글꼴로 그리고 받는 대로 바꾼다. 한글 글꼴 굵기 3 → 2 (조각 파일 약 1/3 감소) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Archivo:wdth,wght@100..125,600..900&family=IBM+Plex+Mono:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Archivo:wdth,wght@100..125,600..900&family=IBM+Plex+Mono:wght@400&display=swap" /></noscript>
    <title>집보미 ZIPBOMI — 집에 관한 모든 것</title>
    <!-- 공유 미리보기(og:*) 메타는 서버가 응답할 때 backend/app/og_meta.py 가 페이지별로 넣는다 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
