<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#120F08" />
<title>집보미 — 연결 확인</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120F08;color:#FFFBF0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;text-align:center;padding:24px}
  main{max-width:340px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:20px;margin:18px 0 8px}
  p{margin:0 0 20px;line-height:1.6;color:#d9d2bf;font-size:15px}
  button{background:#F5B800;color:#120F08;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" />
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>집보미는 최신 시세와 공고를 보여 드리기 때문에 연결되어 있어야 열립니다. 연결이 돌아오면 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
