# config/keywords.yaml — 키워드 시드 (DB 가 비어 있을 때 한 번만 들어가고, 이후엔 관리 > 수집 설정 > 키워드에서 편집한다).
# include 키워드 중 하나라도 걸려야 후보가 되고, exclude 키워드가 걸리면 버린다. category 는 ZipGenie 의 3개 분류
# (시장·시세 / 정책·세금·대출 / 청약·분양·개발).
# needs_ai: true — '부동산 단어 동반 필요'(필드 이름은 예전 그대로 둔다). 금리·세금·거래·건설처럼 넓은 단어는
#   제목에 부동산 단어(filters.AI_ANCHORS — 아파트·주택·전세·청약 등)가 있거나, needs_ai 가 아닌 포함 규칙이
#   같은 글에 함께 걸릴 때만 통과한다.
# 매칭: 영어는 단어 경계(짧은 약어는 앞뒤, 긴 단어는 앞), 한글은 포함 검사 (pipeline/filters.py).
# 주의 — 한글은 포함 검사라 '전세'는 '전세계'에, '매매'는 '성매매'에, '청약'은 '공모주 청약'에도 걸린다.
#   그래서 '전세'는 단독으로 쓰지 않고 '전셋값·전세가·전세 계약'처럼 붙은 꼴만 쓰고, 나머지는 제외 규칙으로 막는다.
#   '리츠'도 '메리츠'에 걸려서 REITs·부동산투자회사만 쓴다. '주식'은 '전세 살면서 주식?' 같은 부동산 기사를 막아서 제외에서 뺐다.
# 2026-11-02 부동산으로 전면 교체.

# ── 시장·시세 ────────────────────────────────────────────────
- {keyword: "집값", aliases: ["아파트값", "아파트 가격", "아파트 매매가", "주택가격", "주택 가격", "아파트 매매가격", "아파트 시세", "실거래", "실거래가", "거래 절벽", "거래절벽", "주간 아파트", "부동산원 통계", "KB부동산", "평당가", "3.3㎡당"], mode: include, weight: 2.0, category: "시장·시세"}
- {keyword: "전월세", aliases: ["전셋값", "전세가", "전세가율", "전세금", "전세 계약", "전세 매물", "전세 시장", "전세난", "전세사기", "전세 사기", "깡통전세", "역전세", "전세보증", "전세보증금", "반전세", "월세", "월셋값", "임대차", "보증금", "계약갱신", "갱신청구권", "임차인", "임대인", "세입자", "집주인"], mode: include, weight: 2.0, category: "시장·시세"}
- {keyword: "부동산 시장", aliases: ["부동산", "주택시장", "주택 시장", "매수심리", "매수세", "매도세", "매물", "갭투자", "영끌", "상승장", "하락장", "똘똘한 한 채", "상급지", "갈아타기", "급매", "급매물", "강남3구", "한강벨트", "노도강", "마용성", "내 집 마련", "내집마련", "무주택"], mode: include, weight: 1.5, category: "시장·시세"}
- {keyword: "아파트", aliases: ["주택", "공동주택", "단독주택", "주거"], mode: include, weight: 1.0, category: "시장·시세"}
- {keyword: "오피스텔·빌라", aliases: ["오피스텔", "빌라", "다세대", "다가구", "연립주택", "생활형숙박시설", "생숙", "지식산업센터", "도시형생활주택", "REITs", "부동산투자회사"], mode: include, weight: 1.0, category: "시장·시세"}
# 넓은 단어 — 제목에 부동산 단어가 있을 때만
- {keyword: "거래·매매", aliases: ["매매", "매매가", "시세", "호가", "신고가", "신저가", "거래량", "상승률", "하락률", "거래", "매수", "매도", "경매", "공매", "낙찰가율", "토지", "상가", "수도권"], mode: include, weight: 0.5, category: "시장·시세", needs_ai: true}

# ── 정책·세금·대출 ───────────────────────────────────────────
- {keyword: "부동산 정책", aliases: ["부동산 대책", "주택 정책", "주택정책", "공급 대책", "주택공급", "주택 공급", "규제지역", "조정대상지역", "투기과열지구", "토지거래허가", "토허제", "토허구역", "토허 구역", "국토교통부", "국토부", "분양가 상한제", "분양가상한제", "재건축 초과이익", "재초환", "임대차법", "임대차 3법", "공공주택", "공공임대", "임대주택", "주거복지", "주택법", "한국부동산원", "LH", "주택도시보증공사", "HUG"], mode: include, weight: 2.0, category: "정책·세금·대출"}
- {keyword: "부동산 세금", aliases: ["종부세", "종합부동산세", "양도세", "양도소득세", "취득세", "재산세", "보유세", "공시가격", "공시가", "현실화율", "다주택자", "1주택자", "1가구 1주택", "일시적 2주택"], mode: include, weight: 2.0, category: "정책·세금·대출"}
- {keyword: "주택담보대출", aliases: ["주담대", "LTV", "DSR", "스트레스 DSR", "DTI", "디딤돌", "보금자리론", "버팀목", "신생아 특례", "전세대출", "전세자금대출", "중도금 대출", "중도금대출", "잔금대출", "가계대출", "생애최초"], mode: include, weight: 2.0, category: "정책·세금·대출"}
# 넓은 단어 — 제목에 부동산 단어가 있을 때만
- {keyword: "금리·세제", aliases: ["금리", "기준금리", "대출 규제", "대출규제", "대출금리", "한국은행", "가계부채", "세제", "세제 개편", "세법", "증여", "증여세", "상속", "상속세", "규제 완화", "규제 강화"], mode: include, weight: 1.0, category: "정책·세금·대출", needs_ai: true}

# ── 청약·분양·개발 ───────────────────────────────────────────
- {keyword: "청약", aliases: ["청약통장", "주택청약", "청약 경쟁률", "청약경쟁률", "무순위", "줍줍", "특별공급", "청약 가점", "청약가점", "로또 청약", "사전청약", "신혼희망타운", "당첨 가점", "당첨자 발표"], mode: include, weight: 2.0, category: "청약·분양·개발"}
