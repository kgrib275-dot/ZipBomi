# ── 제외 (제목에만 적용) ─────────────────────────────────────────────────────
- {keyword: "코인", aliases: ["비트코인", "가상화폐", "가상자산", "암호화폐", "이더리움", "밈코인", "스테이블코인", "NFT"], mode: exclude, weight: 1.0, category: ""}
- {keyword: "주가", aliases: ["특징주", "목표주가", "상한가", "급등주", "증시", "코스피", "코스닥", "공모주", "일반청약", "오늘청약", "수요예측", "IPO", "목표가", "나스닥", "뉴욕증시"], mode: exclude, weight: 1.0, category: ""}
# '로또'는 넣지 않는다 — '로또 청약'이 부동산 기사에 자주 나온다. 복권 기사만 막는다.
# '올림픽'도 넣지 않는다 — '올림픽파크포레온'·'올림픽선수촌' 같은 단지 이름에 걸린다.
- {keyword: "연예·스포츠", aliases: ["아이돌", "드라마", "예능", "운세", "로또 당첨번호", "로또 1등", "프로야구", "야구", "축구", "K리그", "농구", "배구"], mode: exclude, weight: 1.0, category: ""}
# 광고성 분양 홍보 기사 (견본주택 개관·경품 행사 안내)
- {keyword: "분양 홍보", aliases: ["모델하우스 오픈", "견본주택 오픈", "견본주택 개관", "모델하우스 개관", "그랜드 오픈", "그랜드오픈", "경품 이벤트", "경품 증정", "사은품", "방문객 몰려", "인파 몰려"], mode: exclude, weight: 1.0, category: ""}
# 한글 포함 검사 때문에 걸리는 다른 뜻의 단어
- {keyword: "동음이의", aliases: ["전세기", "전세버스", "성매매", "반려견 분양", "강아지 분양", "고양이 분양", "반려동물 분양"], mode: exclude, weight: 1.0, category: ""}
- {keyword: "부고·인사", aliases: ["[부고]", "부친상", "모친상", "별세", "[인사]", "임원 인사", "정기 인사", "사장단 인사"], mode: exclude, weight: 1.0, category: ""}
