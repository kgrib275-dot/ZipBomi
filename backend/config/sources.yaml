# config/sources.yaml — ZipGenie 수집 소스 (부동산 뉴스·정책).
# 각 소스의 group/site는 홈 화면 "어디서 찾아 읽나" 목록에 쓰인다. 수집 on/off는
# 관리 > 수집 설정에서 바꾸며 data/settings.json에 저장된다.
# 2026-11-02 전면 교체: AI 소스를 모두 빼고 부동산 소스로 바꿨다. 아래 주소는 모두 실제로 요청해
#   항목(기사)이 나오는 것만 넣었다. 응답 없음·404·날짜 없는 피드는 sources_candidates.yaml 하단에 이유와 함께 적어 둠.
# - 국토교통부·한국부동산원은 공개 RSS가 없다(정책브리핑 korea.kr RSS도 서비스 중단). 국토교통부는 공식 네이버 블로그 RSS와
#   Google 뉴스 검색으로, 한국부동산원은 Google 뉴스 검색(주간 아파트값 동향 보도)으로 받는다.
# - 머니투데이 부동산 섹션 RSS는 폐지(404·410) — Google 뉴스 검색으로 대신 받는다.
# - type: html(목록 페이지 파서, pipeline/collectors/html_pages.py)은 hbr/bcg 파서뿐이라 지금은 쓰지 않는다.
# - type: rss 는 날짜가 없는 글을 버리므로, 날짜를 안 주는 피드(파이낸셜뉴스·한겨레)는 넣지 않았다.

pipeline:
  dedup:
    title_similarity_threshold: 88
    title_recent_days: 7
  gemini:
    # 무료 등급 키는 모델별·프로젝트별 하루 요청 수가 매우 적다(2026-10-27 실측: gemini-2.5-flash 20회/일).
    # 호출이 많은 채점·질문하기를 가벼운 모델로 돌리고 싶으면 아래 *_model 값을 바꾼다.
    model: gemini-2.5-flash          # 기본값 (아래 항목이 비어 있으면 사용)
    score_model: gemini-2.5-flash    # 수집 기사 부동산 관련도 채점 (배치당 1회)
    note_model: gemini-2.5-flash     # 노트 초안 (기사당 1회)
    weekly_model: gemini-2.5-flash   # 주간 흐름 (주 1회)
    chat_model: gemini-2.5-flash     # 질문하기·데일리 종합 (질문당 1~3회)
    score_batch_size: 150          # 수집 한 번의 기사를 요청 한 번에 (이보다 많을 때만 나눔)
  # 기사 본문을 가져와 노트 초안에 넣을 최대 글자 수
  article_max_chars: 15000

