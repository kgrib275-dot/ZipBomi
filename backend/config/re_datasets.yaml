# 부동산 데이터 수집 목록 (배치 '부동산 데이터 수집' = jobs kind re_data, pipeline/redata.py)
#
# - needs_key: true 는 공공데이터포털(data.go.kr) 키 DATA_GO_KR_KEY 하나로 받지만, API 마다 '활용신청'을 따로 해야 한다.
#   data_url 페이지에서 [활용신청] → 승인(자동승인은 보통 1시간 안)되면 다음 실행부터 저절로 받는다. 신청 안 된 API 는
#   관리 > 부동산 데이터에 '활용신청 필요'로 뜨고 다른 데이터셋은 그대로 진행한다.
# - 키 없이 받는 것(needs_key: false)은 2026-11-02 실제로 요청해 응답을 확인한 것만 넣었다.
# - enabled·backfill_months 는 기본값이다. 관리 화면에서 바꾸면 DB(re_dataset_conf)에 저장돼 이 파일보다 우선한다.
# - 2026-11-02 확인: 아래 12개 RTMS 서비스 모두 키 없이 부르면 HTTP 401 + SERVICE_KEY_IS_NULL XML 이 온다 (없는 이름은 NO_OPENAPI_SERVICE_ERROR).
# - 24개월 과거 채우기 호출 수(실거래가 데이터셋 하나): 시군구 108곳 × 24달 = 2,592번 (+ 1천 건 넘는 칸은 쪽마다 1번). 하루 상한 9,000번 안에서
#   하루에 끝나지만 한 번 실행 시간(150분)을 데이터셋끼리 나눠 쓰므로 며칠에 걸쳐 이어 받는다. 매일 갱신은 108 × 3달 = 324번.

defaults:
  backfill_months: 24        # 처음 한 번 과거로 채우는 달 수
  refresh_months: 3          # 매 실행 다시 받는 최근 달 수 (이번 달 + 지난 2달 — 신고 기한 30일·해제 신고로 늦게 바뀐다)
  daily_cap: 9000            # 데이터셋(API) 하나의 하루 호출 상한 (개발 계정 API 별 1만 건 — 화면 즉시 조회 몫을 남긴다)
  max_minutes_per_run: 150   # 한 번 실행의 최대 시간 — 넘으면 멈추고 다음 실행에 이어서 (작업 잠금 3시간 안)
  delay_sec: 0.2             # 요청 사이 쉬는 시간 (공공 서버에 몰아치지 않게)
  # 실거래가 CSV 자동 다운로드 (rt.molit.go.kr 조건별 자료제공, pipeline/rt_download.py) — 데이터셋마다 source: auto|api|csv
  #   auto(기본): API 가 정상이면 API, 키 없음·활용신청 필요·오류면 CSV. csv: 늘 CSV(API 안 부름). api: CSV 안 받음.
  #   매일 전국 × 최근 3달(지지난달·지난달·이번 달 1일~오늘, 데이터셋마다 3건) + 남은 몫으로 시도 × 1년 창 과거 채우기(오래된 달부터).
  #   사이트 한도는 하루 100건 — 우리는 그중 csv_daily_cap(최대 60, 코드에서 60 넘게 못 올림)만 쓰고 나머지는 손으로 받을 몫으로 남긴다.
  csv_daily_cap: 60
  csv_max_minutes: 60        # 한 번 실행에서 CSV 에 쓰는 최대 시간 (요청 사이 5초 이상 쉬므로 60건 ≈ 15~30분)

