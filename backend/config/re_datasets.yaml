  # ───────── 한국부동산원 청약홈 (api.odcloud.kr, 같은 DATA_GO_KR_KEY) ─────────
  # 2026-11-02: 두 서비스의 swagger(infuser.odcloud.kr/api/stages/37000·36148/api-docs)로 op·항목 이름을 확인했고,
  # 키 없이 부르면 HTTP 401 {"code":-401,"msg":"인증키는 필수 항목 입니다."} 가 온다. 공고는 re_apply_notice 에 저장 (지도 기능과 공유).
  - key: apply_notice
    name: 청약 분양공고
    group: applyhome
    data_id: 15098547
    needs_key: true
    enabled: true
    endpoints:
      - {op: ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail, label: APT}
      - {op: ApplyhomeInfoDetailSvc/v1/getUrbtyOfctlLttotPblancDetail, label: 오피스텔·도시형·민간임대·생활숙박}
      - {op: ApplyhomeInfoDetailSvc/v1/getRemndrLttotPblancDetail, label: APT 무순위·잔여세대}
      - {op: ApplyhomeInfoDetailSvc/v1/getPblPvtRentLttotPblancDetail, label: 공공지원 민간임대}
      - {op: ApplyhomeInfoDetailSvc/v1/getOPTLttotPblancDetail, label: 임의공급}
    desc: "청약홈 분양공고 — 공고일·특별/1·2순위 접수일·당첨자 발표·계약일·입주 예정월·공급 위치·세대수·시공사·투기과열/조정/분양가상한제 여부. 실수요자 청약 일정표, 중개사 신규 공급 파악."
